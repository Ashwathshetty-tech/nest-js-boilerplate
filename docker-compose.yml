version: "2.1"

services:
  redis:
    container_name: redis
    image: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  postgres:
    image: postgres:latest
    container_name: postgres_db
    environment:
        POSTGRES_HOST_AUTH_METHOD: trust
    #   POSTGRES_USER: myuser
    #   POSTGRES_PASSWORD: mypassword
    #   POSTGRES_DB: mydb
    ports:
      - "5432:5432"    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: mongo_db
    # environment:
    #     # POSTGRES_HOST_AUTH_METHOD: trust
    # #   POSTGRES_USER: myuser
    # #   POSTGRES_PASSWORD: mypassword
    # #   POSTGRES_DB: mydb
    ports:
      - "27017:27017"        
    healthcheck:
      test: ["CMD-SHELL", "mongo --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  app:
  app:
    build: .
    container_name: nodejs-boilerplate
    restart: always
    depends_on:
      - redis
      - mongodb
      - postgres
    environment:
      - PORT=${PORT:-3000}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_URL=${REDIS_URL}
      - MONGODB_URI=${MONGODB_URI}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - NEW_RELIC_APP_NAME=nodejs-boilerplate
      - NEW_RELIC_LICENSE_KEY=4dd64769450b22a52544c036e908b6dfFFFFNRAL
      - NEW_RELIC_LOG_LEVEL=info
    ports:
      - "3006:3000"
    # Optional: basic healthcheck to ensure the container is listening.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3